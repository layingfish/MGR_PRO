paths:
  train_query_manifest: TRAIN_QUERY_MANIFEST_PATH
  train_item_manifest: TRAIN_ITEM_MANIFEST_PATH
  train_query_embeddings: TRAIN_QUERY_EMBEDDING_PATH
  train_item_embeddings: TRAIN_ITEM_EMBEDDING_PATH
  train_item_modalities: TRAIN_ITEM_MODALITY_PATH
  train_pairs: TRAIN_PAIRS_PATH
  test_query_embeddings: TEST_QUERY_EMBEDDING_PATH
  test_item_embeddings: TEST_ITEM_EMBEDDING_PATH
  test_item_modalities: TEST_ITEM_MODALITY_PATH
  test_qrels: TEST_QRELS_PATH
  quantizer_checkpoint: GENIUS_QUANTIZER_CHECKPOINT_PATH
  retriever_checkpoint: GENIUS_RETRIEVER_CHECKPOINT_PATH
  output_json: GENIUS_OUTPUT_JSON_PATH
quantizer:
  embedding_dim: 768
  levels: 16
  codebook_sizes: [4096, 4096, 4096, 4096, 4096, 4096, 4096, 4096, 4096, 4096, 4096, 4096, 4096, 4096, 4096, 4096]
  modality_tokens: 3
  combiner_projection_dim: 2560
  combiner_hidden_dim: 5120
  kmeans_init: true
  kmeans_iters: 1000
  codebook_decay: 0.9
  ema_update: true
  threshold_ema_dead_code: 2
  learning_rate: 0.0001
  epochs: 20
  batch_size: 512
  rq_loss_weight: 100.0
  mse_loss_weight: 100.0
  prefix_ranking_weight: 0.0
  prefix_ranking_temperature: 0.05
  prefix_ranking_topk: 128
  prefix_ranking_levels: []
retriever:
  model_name: t5-small
  embedding_dim: 768
  learning_rate: 0.0001
  epochs: 30
  batch_size: 512
  beam_size: 50
  output_size: 100
  score_fusion_enabled: false
  score_fusion_weight: 0.0
  score_fusion_normalize_bias: false
seed: 2023
